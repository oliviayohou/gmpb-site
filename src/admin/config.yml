  - name: pb_title
    label: 'Bloc Petit Budget : titre'
    widget: string
    default: Chez toi, en 3 étapes
  - name: pb_intro
    label: 'Bloc Petit Budget : introduction'
    widget: text
    required: false
  - name: steps
    label: 'Bloc Petit Budget : étapes'
