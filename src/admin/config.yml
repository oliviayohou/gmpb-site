# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# =========================================================
# Back office GM.PB (Sveltia CMS)
# Chaque « collection » est une rubrique du back office.
# =========================================================

backend:
  name: github
  repo: oliviayohou/gmpb-site
  branch: main
site_url: https://grandmarketing-petitbudget.fr
display_url: https://grandmarketing-petitbudget.fr
media_folder: src/images/uploads
public_folder: /images/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: articles_gm
  label: Articles Grand Marketing
  label_singular: Article Grand Marketing
  description: Les décryptages des campagnes de grandes marques.
  folder: src/articles/gm
  extension: md
  format: frontmatter
  create: true
  slug: '{{title}}'
  preview_path: blog/{{slug}}/
  summary: '{{title}}'
  sortable_fields:
  - date
  - title
  - category
  view_filters:
  - label: Brouillons
    field: draft
    pattern: true
  - label: Publiés
    field: draft
    pattern: false
  fields:
  - name: title
    label: Titre
    widget: string
  - name: chapo
    label: Chapô
    widget: text
    hint: Les 2 ou 3 phrases d'introduction, en gros sous le titre.
  - name: date
    label: Date de publication
    widget: datetime
    time_format: false
    date_format: DD/MM/YYYY
    format: YYYY-MM-DD
  - name: category
    label: Catégorie
    widget: relation
    collection: settings
    file: categories
    value_field: '{{categories.*.slug}}'
    display_fields:
    - '{{categories.*.name}}'
    search_fields:
    - '{{categories.*.name}}'
  - name: cover
    label: Image de couverture
    widget: image
    required: false
    hint: Format paysage conseillé (1600 × 900 px). Sans image, un visuel coloré est affiché.
  - name: cover_alt
    label: Description de l'image
    widget: string
    required: false
    hint: Ce qu'on voit sur l'image, en une phrase. Lu par Google et les lecteurs d'écran.
  - name: body
    label: Texte de l'article
    widget: markdown
    hint: 'Utilise « Titre 2 » pour les intertitres : ils forment le sommaire.'
  - name: pb_title
    label: 'Bloc Petit Budget : titre'
    widget: string
    required: false
    default: La version Petit Budget
    hint: Facultatif pour un article Grand Marketing.
  - name: pb_intro
    label: 'Bloc Petit Budget : introduction'
    widget: text
    required: false
  - name: steps
    label: 'Bloc Petit Budget : étapes'
    label_singular: étape
    widget: list
    required: false
    hint: Laisse vide si tu ne veux pas de bloc Petit Budget dans cet article.
    fields:
    - name: title
      label: Titre de l'étape
      widget: string
    - name: text
      label: Explication
      widget: text
      required: false
  - name: budget
    label: 'Bloc Petit Budget : budget'
    widget: string
    required: false
    hint: Ex. 0 à 20 €
  - name: time
    label: 'Bloc Petit Budget : temps'
    widget: string
    required: false
    hint: Ex. 1 heure
  - name: takeaways
    label: À retenir
    label_singular: point
    widget: list
    required: false
    field:
      name: point
      label: Point à retenir
      widget: string
  - name: twin
    label: Article jumeau (Petit Budget)
    widget: relation
    collection: articles_pb
    value_field: '{{slug}}'
    display_fields:
    - '{{title}}'
    search_fields:
    - '{{title}}'
    required: false
    hint: L'article Petit Budget qui répond à ce décryptage. Le lien s'affiche en fin d'article.
  - name: seo_title
    label: Titre pour Google
    widget: string
    required: false
    maxlength: 60
    hint: 60 caractères maximum. Sinon, le titre de l'article est utilisé.
  - name: seo_description
    label: Description pour Google
    widget: text
    required: false
    maxlength: 155
    hint: 155 caractères maximum. Sinon, le chapô est utilisé.
  - name: linkedin_post
    label: Post LinkedIn associé
    widget: text
    required: false
    hint: Ton brouillon de post, pour le copier sur LinkedIn.
  - name: featured
    label: Mettre à la une sur l'accueil
    widget: boolean
    default: false
    required: false
  - name: draft
    label: Brouillon (pas visible sur le site)
    widget: boolean
    default: true
    required: false
- name: articles_pb
  label: Articles Petit Budget
  label_singular: Article Petit Budget
