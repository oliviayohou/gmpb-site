- name: settings
  label: Réglages du site
  description: Fonctionnalités, liens et catégories.
  editor:
    preview: false
  files:
  - name: site
    label: Réglages généraux
    file: src/_data/site.json
    fields:
    - name: newsletter
      label: Newsletter (encarts et bouton du menu)
      widget: boolean
      default: false
    - name: newsletterFormUrl
      label: Adresse du formulaire newsletter (Brevo ou MailerLite)
      widget: string
      required: false
      hint: À remplir le jour où tu actives la newsletter.
    - name: devis
      label: Demandes de devis (formulaire et boutons)
      widget: boolean
      default: false
    - name: web3formsKey
      label: Clé Web3Forms du formulaire de contact
      widget: string
      required: false
      hint: 'Clé gratuite sur web3forms.com : les messages arrivent sur l''e-mail associé.'
    - name: contactDelay
      label: Délai de réponse affiché
      widget: string
      required: false
    - name: description
      label: Description du site (Google)
      widget: text
    - name: linkedin
      label: Lien LinkedIn
      widget: string
      required: false
    - name: instagram
      label: Lien Instagram
      widget: string
      required: false
    - name: url
      label: Adresse du site
      widget: string
      hint: À changer quand tu brancheras ton nom de domaine (ex. https://monsite.fr).
    - name: title
      label: Nom du site
      widget: string
    - name: shortTitle
      label: Nom court
      widget: string
    - name: author
      label: Autrice
      widget: string
  - name: categories
    label: Catégories
    file: src/_data/categories.json
    fields:
    - name: categories
      label: Catégories
      label_singular: catégorie
      widget: list
      summary: '{{fields.name}}'
      fields:
      - name: name
        label: Nom
        widget: string
      - name: slug
        label: Adresse (sans accents ni espaces)
        widget: string
        pattern:
        - ^[a-z0-9-]+$
        - Seulement des minuscules, des chiffres et des tirets.
        hint: Ex. promotions-offres. Évite de la changer une fois des articles publiés.
      - name: color
        label: Couleur
        widget: select
        options:
        - label: Jaune
          value: '#FFD93D'
        - label: Turquoise
          value: '#3ED6C4'
        - label: Lavande
          value: '#AE8AEA'
      - name: description
        label: Description
        widget: text
